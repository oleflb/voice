[workspace]
members = ["crates/voice-core", "crates/voice-playback"]
resolver = "3"

[package]
name = "voice"
version = "0.1.0"
edition = "2024"

[dependencies]
voice-core = { path = "crates/voice-core" }
voice-playback = { path = "crates/voice-playback" }
anyhow = "1"
bytes = "1"
crossterm = { version = "0.29", features = ["osc52"] }
directories = "6"
crossbeam-queue = "0.3"
str0m = { version = "0.25", default-features = false, features = ["rust-crypto"] }
stun-types = "2"
maudio = "0.1.15"
nostr-sdk = "0.44"
rusty-opus = "1.1"
parking_lot = "0.12"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sonora = "0.3"
tempfile = "3"
tokio = { version = "1", features = ["net", "macros", "rt-multi-thread", "sync", "time"] }
unicode-segmentation = "1"
unicode-width = "0.2"

[dev-dependencies]
nostr-relay-builder = "0.44"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[profile.dev.package.rusty-opus]
opt-level = 2

[profile.dev.package.sonora-aec3]
opt-level = 2

[profile.dev.package.sonora-agc2]
opt-level = 2
