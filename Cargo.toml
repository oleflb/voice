[package]
name = "voice"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
crossterm = { version = "0.29", features = ["osc52"] }
directories = "6"
crossbeam-queue = "0.3"
iroh = { version = "1.4", default-features = false, features = ["tls-ring"] }
maudio = "0.1.15"
nostr-sdk = "0.44"
rusty-opus = "1.1"
parking_lot = "0.12"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sonora = "0.3"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }
unicode-segmentation = "1"
unicode-width = "0.2"

[profile.dev.package.rusty-opus]
opt-level = 2

[profile.dev.package.sonora-aec3]
opt-level = 2
