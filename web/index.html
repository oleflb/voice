<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voice</title>
  <link data-trunk rel="rust" href="../crates/voice-core/Cargo.toml">
  <link data-trunk rel="css" href="style.css">
  <link data-trunk rel="copy-file" href="peer.js">
</head>
<body><main>
  <header><h1>Voice</h1><span id="where">Welcome</span></header>
  <section id="profile" hidden>
    <h2>What should people call you?</h2>
    <form id="profile-form"><label>Display name <input id="name" required maxlength="64" autocomplete="nickname"></label><button>Save name</button></form>
  </section>
  <section id="lobby" hidden>
    <div class="bar"><h2>Lobby</h2><button id="rename"></button></div>
    <div class="columns">
      <section><h3>Saved rooms</h3>
        <label class="sr" for="rooms">Saved rooms</label><select id="rooms" size="6"></select>
        <div class="actions"><button id="join">Join room</button><button id="copy">Copy invite</button></div>
        <h3>Who’s around</h3><p id="roster" aria-live="polite">Select a room</p>
      </section>
      <section><h3>Add a room</h3>
        <form id="create"><label>Room name <input name="name" required maxlength="64"></label><button>Create room</button></form>
        <form id="import"><label>Private invite <input name="invite" required type="password" autocomplete="off"></label><button>Import invite</button></form>
      </section>
    </div>
  </section>
  <section id="call" hidden>
    <div class="bar"><h2 id="title"></h2><div class="actions"><button id="share">Copy invite</button><button id="leave">Leave</button></div></div>
    <div class="columns room">
      <section><h3>Participants</h3><ul id="peers"></ul></section>
      <section><h3>Chat</h3><ol id="chat" role="log" aria-label="Chat history"></ol>
        <form id="compose"><label class="sr" for="text">Message</label><input id="text" placeholder="Message the room" required maxlength="4096" autocomplete="off"><button>Send</button></form>
      </section>
    </div>
  </section>
  <p id="status" role="status">Loading…</p>
</main><script data-trunk type="module" src="app.js"></script></body>
</html>
